name: Daily 2026 Price Scraper

on:
  schedule:
    # Run once daily at 03:00 UTC (06:00 TRT)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 2026 Live Price Scraper
        run: npm run scrape:2026

      - name: Commit and push updated price data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/lib/smartphonesData.json src/data/scraping_report_2026.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): daily live price scrape for 2026 models [skip ci]" && git push)
