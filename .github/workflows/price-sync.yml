name: Store Offer Observation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'İncelenmiş kaynak sınırı (1–5000)'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  observe-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:offer-ingestion
      - name: Kaynak gözlemi (katalog değişmez, yayın yapılmaz)
        env:
          OFFER_LIMIT: ${{ inputs.limit || '50' }}
        run: node scripts/observeStoreOffers.cjs --limit="$OFFER_LIMIT" --report=scratch/store-offer-report.json
      - name: Eksik ve başarılı kanıt raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-offer-observations
          path: scratch/store-offer-report.json
          if-no-files-found: warn
